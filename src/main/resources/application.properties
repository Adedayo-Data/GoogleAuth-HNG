spring.application.name=googleAuth

# Database config
spring.datasource.url = jdbc:postgresql://localhost:5432/springauth
spring.datasource.username = postgres
spring.datasource.password = 0000
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect


# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=1081241860222-hnnol0jtq5c8qpntos44qh5sks97qjum.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Paystack Configuration
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.webhook-secret=${PAYSTACK_WEBHOOK_SECRET}

spring.profiles.active = prod